name: Swift build

on:
  pull_request:
    paths:
      - 'App/**'
      - '.github/workflows/swift-build.yml'
  push:
    branches: [main]
    paths:
      - 'App/**'
      - '.github/workflows/swift-build.yml'

jobs:
  xcodebuild:
    # MovieBox targets macOS 26.5; macos-15 runners only ship Xcode 16.x.
    runs-on: macos-26
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'
      # DevelopmentSecrets.swift is gitignored; the .example file is enough for compile-only CI.
      - name: Stub development secrets
        run: cp MovieBox/Configuration/DevelopmentSecrets.swift.example MovieBox/Configuration/DevelopmentSecrets.swift
      - name: Build MovieBox (macOS)
        run: xcodebuild -project MovieBox.xcodeproj -scheme MovieBox -destination 'platform=macOS' -quiet build
